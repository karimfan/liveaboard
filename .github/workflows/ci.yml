name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^web/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  frontend:
    name: Web build + style guardrail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Stylelint (no raw hex / font allowlist)
        run: npm run lint:styles
      - name: Build
        run: npm run build
